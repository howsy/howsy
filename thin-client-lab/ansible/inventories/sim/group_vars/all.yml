ad_domain: lab.example.com
ad_realm: LAB.EXAMPLE.COM
ad_join_user: Administrator
ad_join_password: "{{ lookup('env', 'ADMIN_PASSWORD') }}"
ad_computer_ou: OU=Computers,OU=CallCenterTest,DC=lab,DC=example,DC=com
ad_allowed_groups: [CC-Agents-Test]

rdp_host: lb.lab.example.com
genesys_org_url: https://apps.mypurecloud.com

# Simulation specifics
home_share_type: none          # the containers share a volume; the real lab uses nfs
chrome_install: "{{ lookup('env', 'CHROME_INSTALL') | default('true', true) | bool }}"
lab_test_tools: true      # xvfb/pamtester so the test suite can drive the endpoint

vpn_gateway_endpoint: 172.30.0.60:51820
vpn_gateway_pubkey: "{{ lookup('file', inventory_dir + '/../../../.lab/vpn/gateway.pub') }}"
vpn_private_key: "{{ lookup('file', inventory_dir + '/../../../.lab/vpn/' + inventory_hostname + '.key') }}"
vpn_routed_subnets: [10.10.0.0/24]
vpn_dns_server: 10.10.0.10
vpn_dns_mode: resolvconf       # docker owns resolv.conf; real endpoints use systemd-resolved

# Broker: single sign-on from the laptop and "open on my laptop" (Genesys)
broker_url: http://broker-01.lab.example.com:8088
broker_spn: HTTP@broker-01.lab.example.com
broker_host_token: "{{ lookup('file', inventory_dir + '/../../../.lab/broker-token') }}"

# Agent desktop: one icon / tab / bookmark per system. Same list the tests check.
cc_systems: "{{ (lookup('file', inventory_dir + '/../../../tests/apps.sim.yml') | from_yaml).apps }}"

# Management console (dashboard) and the agents that report to it
console_url: http://broker-01.lab.example.com:8090
console_device_token: "{{ lookup('file', inventory_dir + '/../../../.lab/console-token') }}"
