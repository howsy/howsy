# Simulated lab (docker compose). Addresses match docker-compose.yml.
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: "{{ lookup('env', 'LAB_SSH_KEY') or (inventory_dir + '/../../../.lab/ssh/id_ed25519') }}"
  children:
    session_hosts:
      hosts:
        sh-01: {ansible_host: 10.10.0.21}
        sh-02: {ansible_host: 10.10.0.22}
    endpoints:
      hosts:
        ep-office-01: {ansible_host: 10.10.0.50}
      children:
        home_endpoints:
          hosts:
            # vpn_address must match the order the gateway assigns peers (sorted key names, from .10)
            ep-home-01: {ansible_host: 172.30.0.100, vpn_address: 10.99.0.10}
