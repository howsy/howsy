# Ubuntu 24.04 ships Chromium/Firefox only as snaps, which behave badly on
# multi-user xrdp hosts and lock-down setups. Google Chrome's .deb is used instead.
# Google publishes Chrome for Linux on x86-64 only.
- name: Decide whether to install Chrome
  ansible.builtin.set_fact:
    chrome_do_install: "{{ (chrome_install | bool) and ansible_architecture == 'x86_64' }}"

# Chrome's package and its daily cron job rewrite the apt source file themselves,
# which fights with the task below (every run would report a change). This is
# Chrome's documented switch to leave the repository to us.
- name: Chrome leaves its apt source to Ansible
  ansible.builtin.copy:
    content: |
      repo_add_once="false"
      repo_reenable_on_distupgrade="false"
    dest: /etc/default/google-chrome
    mode: "0644"
  when: chrome_do_install

- name: Google signing key
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/keyrings/google-chrome.asc
    mode: "0644"
  when: chrome_do_install

- name: Google Chrome apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.asc] https://dl.google.com/linux/chrome/deb/ stable main"
    filename: google-chrome
  when: chrome_do_install

- name: Install Google Chrome
  ansible.builtin.apt:
    name: google-chrome-stable
  when: chrome_do_install

- name: Managed policy directory
  ansible.builtin.file:
    path: /etc/opt/chrome/policies/managed
    state: directory
    mode: "0755"

- name: Managed Chrome policies (users cannot override)
  ansible.builtin.copy:
    content: "{{ chrome_policies | combine(chrome_extra_policies) | to_nice_json }}\n"
    dest: /etc/opt/chrome/policies/managed/cc-policy.json
    mode: "0644"
