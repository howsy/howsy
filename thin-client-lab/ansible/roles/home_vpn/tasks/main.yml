# Lab step 9: VPN that starts at boot, before anyone can log in, with split tunnelling.
- name: WireGuard tools
  ansible.builtin.apt:
    name: "{{ ['wireguard-tools'] + (['wireguard-go'] if is_container else []) }}"
    install_recommends: false

- name: Tunnel DNS helper
  ansible.builtin.template:
    src: cc-vpn-dns.j2
    dest: /usr/local/sbin/cc-vpn-dns
    mode: "0755"

- name: Tunnel configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: Restart VPN

- name: Drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/wg-quick@wg0.service.d
    state: directory
    mode: "0755"

- name: VPN comes up before the login screen
  ansible.builtin.template:
    src: before-login.conf.j2
    dest: /etc/systemd/system/wg-quick@wg0.service.d/cc-before-login.conf
    mode: "0644"
  notify: Restart VPN

- name: TUN device for the userspace WireGuard fallback (simulation)
  ansible.builtin.shell: |
    [ -c /dev/net/tun ] && exit 0
    mkdir -p /dev/net && mknod /dev/net/tun c 10 200 && chmod 666 /dev/net/tun && echo created
  register: _tun
  changed_when: "'created' in _tun.stdout"
  when: is_container

- name: VPN enabled at boot
  block:
    - name: VPN enabled at boot
      ansible.builtin.systemd_service:
        name: wg-quick@wg0
        enabled: true
        state: started
        daemon_reload: true
  rescue:
    - name: Why the tunnel did not start
      ansible.builtin.command: journalctl -u wg-quick@wg0 --no-pager -n 25
      register: _wg_journal
      changed_when: false

    - name: Report the tunnel error
      ansible.builtin.fail:
        msg: "wg-quick@wg0 did not start. Its log:\n{{ _wg_journal.stdout }}"
