# Failed or rate-limited portal logins as seen by nginx.
# Note: a normal TOTP login also produces one 403 (the "enter your code" step),
# so maxretry in the jail is set with that in mind. A wrong TOTP code returns 400.
[Definition]
failregex = ^<HOST> \S+ \S+ .*"POST /guacamole/api/tokens HTTP/[0-9.]+" (?:400|403|429) 
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z
