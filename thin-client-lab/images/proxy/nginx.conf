# Only this proxy is reachable from the internet. Guacamole stays on the inside.
server_tokens off;

# Login endpoint. The Guacamole web app also POSTs here on every page load and
# token refresh, so the limit must leave room for that; fail2ban bans failures.
limit_req_zone $binary_remote_addr zone=portal_login:10m rate=30r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2 default_server;
  ssl_certificate     /etc/nginx/tls/portal.crt;
  ssl_certificate_key /etc/nginx/tls/portal.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = / { return 302 /guacamole/; }

  location = /guacamole/api/tokens {
    limit_req zone=portal_login burst=20 nodelay;
    proxy_pass http://guac:8080/guacamole/api/tokens;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /guacamole/ {
    proxy_pass http://guac:8080/guacamole/;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 1h;
    client_max_body_size 1m;   # no file uploads through the portal
  }

  location / { return 404; }
}
