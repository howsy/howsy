# RDP load balancer (step 6). In production: two of these with keepalived.
global
  log stdout format raw local0
  stats socket /tmp/haproxy.sock mode 600 level admin

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client  8h
  timeout server  8h
  # If the server a user is stuck to is down, send them to a healthy one.
  option redispatch
  retries 2

frontend rdp
  bind :3389
  # Wait for the RDP connection request so the username cookie can be read.
  tcp-request inspect-delay 5s
  tcp-request content accept if RDP_COOKIE
  default_backend session_hosts

backend session_hosts
  balance leastconn
  # Sticky by RDP username cookie (mstshash) so a user always gets back to
  # their own session, even from a different desk; falls back to client IP.
  stick-table type string len 64 size 100k expire 12h
  stick on req.rdp_cookie(mstshash) if { req.rdp_cookie_cnt(mstshash) gt 0 }
  stick on src
  default-server check inter 2s fall 2 rise 2
  server sh-01 10.10.0.21:3389
  server sh-02 10.10.0.22:3389

frontend stats
  mode http
  bind :8404
  stats enable
  stats uri /
